[package]
name = "scriptlauncher"
version = "0.1.0"
edition = "2021"

[lib]
name = "scriptlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"    # ajout S-04 — anticipation S-05 (ADR-01)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
